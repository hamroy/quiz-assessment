services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quiz-assessment-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "${APP_KEY}"

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: quiz_assessment
      DB_USERNAME: root
      DB_PASSWORD: 

    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: quiz-assessment-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: quiz_assessment
      MYSQL_USER: quiz_user
      MYSQL_PASSWORD: quiz_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot_password"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: